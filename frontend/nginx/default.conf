# BASERASTECH India Tools – static site (no backend)
#
# Note: nginx does not inherit add_header into a location that declares its own add_header.
# All headers are therefore set once at server level; Cache-Control varies via the map below.

map $uri $static_cache_control {
    default                                   "no-cache";
    ~^/assets/                                "public, max-age=31536000, immutable";
    ~*\.(?:png|svg|ico|webmanifest)$          "public, max-age=86400";
    ~*\.(?:xml|txt)$                          "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ---------------------------------------------------------------- compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml;

    # ---------------------------------------------------------------- headers (inherited by every location)
    add_header Cache-Control $static_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Allows Google AdSense (incl. Auto Ads) and Google Analytics; nothing else is loaded from third parties.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://www.googletagmanager.com https://*.google.com https://*.gstatic.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Enable at the TLS terminator once the site is HTTPS-only:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- static files
    location /assets/ {
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- pages
    # Client-only routes (not prerendered) are served by the SPA shell.
    location ~ ^/(search|favorites|favourites|privacy)/?$ {
        try_files /index.html =404;
    }

    # Prerendered pages: /, /tools, /tools/<slug>, /category/<id>, /about, /privacy-policy … Unknown URLs return a real 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
