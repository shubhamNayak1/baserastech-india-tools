name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Configure in Settings → Secrets and variables → Actions → Variables.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://baserastechtool.com' }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED || 'false' }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_TOP_SLOT: ${{ vars.ADSENSE_TOP_SLOT }}
          VITE_ADSENSE_BOTTOM_SLOT: ${{ vars.ADSENSE_BOTTOM_SLOT }}
          VITE_ADSENSE_LEFT_SLOT: ${{ vars.ADSENSE_LEFT_SLOT }}
          VITE_ADSENSE_RIGHT_SLOT: ${{ vars.ADSENSE_RIGHT_SLOT }}
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
